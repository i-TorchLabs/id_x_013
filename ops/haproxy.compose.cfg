# ============================================================================
# HAProxy 配置（compose 模式）—— id_x_013 四容器流量入口
#
# 与 haproxy.cfg 的差异：compose 使用项目默认 bridge 网络，容器间
# 127.0.0.1 不可互访，后端地址改为 DNS 服务名：
#   - web     监听 web:2000      (Next.js)
#   - service 监听 service:7000  (Litestar + GraphQL)
#   - haproxy 监听 :8080         (发布到宿主机 ${POD_PORT:-8013})
#
# 路由规则：
#   /b/id_x_013/   ->  service:7000   (后端 API / GraphQL)
#   其余           ->  web:2000       (前端页面 / 静态资源)
# ============================================================================

global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout http-request 10s

frontend http_in
    bind *:8080
    # 后端 API 路径前缀
    acl is_api path_beg /b/id_x_013/
    use_backend service_backend if is_api
    default_backend web_backend

backend web_backend
    # Next.js 容器：GET / 会被 next.config.ts 重定向到 /f/login
    option httpchk GET /
    http-check expect rstatus ^(200|307|308)$
    server web web:2000 check inter 10s fall 3 rise 2

backend service_backend
    # GraphQL 端点 GET 返回 400（期望 POST），只要任何 HTTP 响应即可视为存活
    option httpchk GET /b/id_x_013/graphql
    http-check expect rstatus ^(200|400|405)$
    # 大文件导入（base64 编码后体积膨胀）需要更长超时
    timeout server 600s
    server service service:7000 check inter 10s fall 3 rise 2
